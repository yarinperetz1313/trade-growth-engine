name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tge_test
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: tge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tge_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run verification
        run: npm run verify
        env:
          TGE_E2E_ARTIFACT_DIR: test-artifacts/e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-artifacts/e2e
          if-no-files-found: warn
          retention-days: 7
